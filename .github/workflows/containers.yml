name: Containers

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler
            kind: host
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            image_suffix: ''
            file: Dockerfile
            cache_scope: cafeglsl-host-amd64
          - name: Wii U library
            kind: wiiu
            arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            image_suffix: -wiiu
            file: Dockerfile.wiiu
            cache_scope: cafeglsl-wiiu-amd64
          - name: compiler
            kind: host
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image_suffix: ''
            file: Dockerfile
            cache_scope: cafeglsl-host-arm64
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - name: Skip ARM64 pull-request build
        if: matrix.arch == 'arm64' && github.event_name == 'pull_request'
        run: echo "ARM64 builds are published only for non-pull-request events"

      - uses: actions/checkout@v7
        if: matrix.arch != 'arm64' || github.event_name != 'pull_request'

      - name: Set normalized image name
        id: image
        if: matrix.arch != 'arm64' || github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.image_suffix }}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${image}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
        if: matrix.arch != 'arm64' || github.event_name != 'pull_request'

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        if: matrix.arch != 'arm64' || github.event_name != 'pull_request'
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=edge,branch=main,enable=${{ matrix.kind == 'host' }}
            type=ref,event=pr
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable=${{ matrix.kind == 'wiiu' && github.event_name == 'push' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ matrix.kind == 'wiiu' && github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ matrix.kind == 'wiiu' && github.event_name == 'push' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pull request image
        if: matrix.arch != 'arm64' && github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.kind }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    name: Publish ${{ matrix.name }} image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler
            kind: host
            image_suffix: ''
          - name: Wii U library
            kind: wiiu
            image_suffix: -wiiu
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index

    steps:
      - uses: actions/checkout@v7

      - name: Set normalized image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.image_suffix }}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${image}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.kind }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=edge,branch=main,enable=${{ matrix.kind == 'host' }}
            type=ref,event=pr
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable=${{ matrix.kind == 'wiiu' && github.event_name == 'push' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ matrix.kind == 'wiiu' && github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ matrix.kind == 'wiiu' && github.event_name == 'push' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-

      - name: Publish image manifests
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          mapfile -t digests < <(find "${RUNNER_TEMP}/digests" -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -eq 0 ]]; then
            echo "No image digests were downloaded" >&2
            exit 1
          fi

          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${IMAGE_NAME}@sha256:${digest}")
          done

          annotation_args=()
          while IFS= read -r annotation; do
            [[ -n "${annotation}" ]] || continue
            annotation_args+=(--annotation "${annotation}")
          done <<< "${IMAGE_ANNOTATIONS}"

          tag_args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            tag_args+=(--tag "${tag}")
          done <<< "${IMAGE_TAGS}"

          docker buildx imagetools create "${annotation_args[@]}" "${tag_args[@]}" "${refs[@]}"
